<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitFlow — Daily Ritual Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>

:root {
  --bg1: #080810; --bg2: #10091e;
  --blob1: #e0dceb33; --blob2: #fdea4024;
  --glass-bg:     rgba(255,255,255,0);
  --glass-border: rgba(229,87,87,0.627);
  --glass-hover:  rgba(255,255,255,0);
  --glass-shadow: rgba(0,0,0,0.369);
  --text-1: #ede8ff; --text-2: #cdc7df;
  --accent: #de5151; --accent2: #c25448; --accent3: #22d3ee; --gold: #fbbf24;
  --input-bg: rgba(255,255,255,0.05); --input-border: rgba(255,255,255,0.295);
  --track: rgba(255,255,255,0.07); --bar-bg: rgba(255,255,255,0.06);
  --dot-off: rgba(255,255,255,0.10); --dot-on: #a855f7;
  --del: #f472b6; --todo-ring: #22d3ee;
  --tr: 0.28s cubic-bezier(.4,0,.2,1);
  --bg-image-url: url('batman.jpg');
  --bg-overlay: 0.2; --bg-image-size: cover; --bg-image-position: center center;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Nunito', sans-serif; min-height: 100vh;
  background:
    radial-gradient(ellipse at 18% 18%, var(--blob1) 0%, transparent 52%),
    radial-gradient(ellipse at 82% 82%, var(--blob2) 0%, transparent 52%),
    linear-gradient(155deg, rgba(8,8,16,var(--bg-overlay)) 0%, rgba(16,9,30,var(--bg-overlay)) 100%),
    var(--bg-image-url) var(--bg-image-position) / var(--bg-image-size) no-repeat fixed;
  background-attachment: fixed; color: var(--text-1); overflow-x: hidden; transition: color var(--tr);
}

.blob { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; opacity:.22; }
.blob-a { width:560px; height:560px; background:radial-gradient(circle,var(--blob1),transparent 70%); top:-140px; left:-140px; animation:drift 14s ease-in-out infinite alternate; }
.blob-b { width:460px; height:460px; background:radial-gradient(circle,var(--blob2),transparent 70%); bottom:-110px; right:-110px; animation:drift 18s ease-in-out infinite alternate-reverse; }
@keyframes drift { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(55px,45px) scale(1.18)} }

/* GLASS */
.glass { background:var(--glass-bg); backdrop-filter:blur(22px) saturate(1.9); -webkit-backdrop-filter:blur(22px) saturate(1.9); border:1px solid var(--glass-border); border-radius:24px; box-shadow:0 8px 36px var(--glass-shadow),inset 0 1px 0 var(--glass-border); position:relative; overflow:hidden; cursor:default; transition:background .4s ease,border-color .4s ease,box-shadow .4s ease,transform .4s cubic-bezier(.34,1.4,.64,1); }
.glass::before { content:''; position:absolute; top:-60%; left:-60%; width:60%; height:220%; background:linear-gradient(105deg,transparent,rgba(255,255,255,.04) 40%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.04) 60%,transparent); transform:translateX(-100%) skewX(-12deg); transition:transform 0s linear; pointer-events:none; z-index:2; border-radius:inherit; }
.glass::after { content:''; position:absolute; top:0; left:8%; right:8%; height:1.5px; background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent2) 70%,transparent); opacity:0; transform:scaleX(.5); transform-origin:center; transition:opacity .4s ease,transform .45s cubic-bezier(.4,0,.2,1); pointer-events:none; z-index:3; border-radius:4px; filter:blur(.5px); }
.glass:hover { background:var(--glass-hover); border-color:rgba(168,85,247,.45); transform:translateY(-6px) scale(1.015); box-shadow:0 28px 70px rgba(0,0,0,.65),0 0 0 1px rgba(168,85,247,.25),0 0 30px rgba(168,85,247,.18),0 0 60px rgba(168,85,247,.08),0 16px 40px rgba(236,72,153,.12),inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.3); }
.glass:hover::before { transform:translateX(300%) skewX(-12deg); transition:transform .75s cubic-bezier(.25,.46,.45,.94); }
.glass:hover::after { opacity:1; transform:scaleX(1); }
.overview-card:hover { border-color:rgba(34,211,238,.4); }
.overview-card:hover::after { background:linear-gradient(90deg,transparent,var(--accent3) 30%,var(--accent) 70%,transparent); }
.section-card.card-habits:hover { border-color:rgba(168,85,247,.5)!important; }
.section-card.card-habits::after { background:linear-gradient(90deg,transparent,#a855f7,transparent)!important; }
.section-card.card-todo:hover { border-color:rgba(34,211,238,.5)!important; }
.section-card.card-todo::after { background:linear-gradient(90deg,transparent,#22d3ee,transparent)!important; }

/* LAYOUT */
.wrap { position:relative; z-index:1; max-width:920px; margin:0 auto; padding:2rem 1.2rem 5rem; }

/* HEADER */
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; position:relative; z-index:100; }
.brand { display:flex; align-items:center; gap:.7rem; }
.brand-icon { filter:drop-shadow(0 0 14px var(--accent)); flex-shrink:0; }
.brand-text h1 { font-family:'Patrick Hand',cursive; font-size:2.1rem; line-height:1; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.brand-text p { font-size:.78rem; color:var(--text-2); font-family:'Patrick Hand',cursive; margin-top:2px; }
.header-right { display:flex; align-items:center; gap:.7rem; }

/* ── DATE PILL BUTTON ── */
.date-pill-wrap { position:relative; }
.date-pill-btn {
  display:flex; align-items:center; gap:.5rem;
  padding:.42rem 1.1rem; font-family:'Patrick Hand',cursive; font-size:.82rem;
  color:var(--text-2); letter-spacing:.04em; cursor:pointer;
  border:1px solid var(--glass-border); border-radius:24px;
  background:var(--glass-bg);
  backdrop-filter:blur(22px) saturate(1.9);
  -webkit-backdrop-filter:blur(22px) saturate(1.9);
  box-shadow:0 8px 36px var(--glass-shadow);
  transition:color var(--tr), border-color .2s, background .2s;
}
.date-pill-btn:hover { color:var(--text-1); border-color:rgba(34,211,238,.5); background:rgba(255,255,255,.04); }
.date-pill-chevron { transition:transform .3s cubic-bezier(.4,0,.2,1); flex-shrink:0; }
.date-pill-btn.open .date-pill-chevron { transform:rotate(180deg); }

/* SCHEDULE DROPDOWN */
.schedule-dropdown {
  position:fixed; top:60px; right:20px; width:330px; z-index:9000;
  background:rgba(10,7,22,0.97); backdrop-filter:blur(32px) saturate(2.2); -webkit-backdrop-filter:blur(32px) saturate(2.2);
  border:1px solid var(--glass-border); border-radius:20px;
  box-shadow:0 28px 70px rgba(0,0,0,.8),0 0 0 1px rgba(168,85,247,.12),0 0 40px rgba(34,211,238,.05);
  padding:1.3rem; opacity:0; transform:translateY(-12px) scale(.96);
  pointer-events:none; transition:opacity .25s cubic-bezier(.4,0,.2,1),transform .25s cubic-bezier(.4,0,.2,1);
}
.schedule-dropdown.open { opacity:1; transform:translateY(0) scale(1); pointer-events:all; }
.sched-hd { font-family:'Patrick Hand',cursive; font-size:1rem; color:var(--text-1); margin-bottom:1rem; display:flex; align-items:center; gap:.4rem; border-bottom:1px solid rgba(255,255,255,.07); padding-bottom:.7rem; }
.sched-field { margin-bottom:.65rem; }
.sched-field label { display:block; font-size:.65rem; color:var(--text-2); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:.28rem; }
.sched-field input { width:100%; padding:.5rem .85rem; border-radius:12px; border:1px solid var(--input-border); background:var(--input-bg); color:var(--text-1); font-family:'Patrick Hand',cursive; font-size:.95rem; outline:none; transition:border-color var(--tr); }
.sched-field input:focus { border-color:var(--accent3); }
.sched-field input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(.55); cursor:pointer; }
.sched-add-btn { width:100%; padding:.55rem; border-radius:12px; background:linear-gradient(135deg,var(--accent3),#0e7490); color:#fff; font-family:'Patrick Hand',cursive; font-size:.95rem; border:none; cursor:pointer; margin-top:.2rem; transition:transform .15s,box-shadow .15s; box-shadow:0 2px 12px rgba(34,211,238,.22); display:flex; align-items:center; justify-content:center; gap:.4rem; }
.sched-add-btn:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(34,211,238,.4); }
.sched-add-btn:active { transform:scale(.98); }
.sched-upcoming { margin-top:.9rem; max-height:160px; overflow-y:auto; }
.sched-upcoming-lbl { font-size:.63rem; color:var(--text-2); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:.4rem; }
.sched-item { display:flex; align-items:center; gap:.45rem; padding:.35rem .6rem; border-radius:10px; background:var(--input-bg); border:1px solid var(--input-border); margin-bottom:.3rem; }
.sched-date { color:var(--accent3); font-size:.7rem; font-family:'Patrick Hand',cursive; flex-shrink:0; min-width:80px; }
.sched-text { flex:1; font-family:'Patrick Hand',cursive; font-size:.82rem; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sched-del { background:none; border:none; color:var(--del); cursor:pointer; padding:0 2px; opacity:.55; transition:opacity .15s; display:flex; align-items:center; }
.sched-del:hover { opacity:1; }

/* overlays removed — document click handler used instead */

/* GRID */
.grid { display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; }
@media (max-width:660px) { .grid { grid-template-columns:1fr; } }
.col-span { grid-column:1/-1; }

/* OVERVIEW */
.overview-card {
  padding: 1.8rem 2rem;
  display: grid;
  grid-template-columns: 115px 1fr 115px;
  align-items: center;
  gap: 1.6rem;
}
@media (max-width: 600px) {
  .overview-card {
    grid-template-columns: 1fr;
    justify-items: center;
    text-align: center;
  }
  .ov-info { text-align: center; }
  .week-dots { justify-content: center; }
}
.ring-wrap svg { display:block; overflow:visible; }
.ov-info { min-width: 0; }
.ov-info h2 { font-family:'Patrick Hand',cursive; font-size:1.55rem; color:var(--text-1); margin-bottom:.3rem; }
.ov-info p { font-size:.85rem; color:var(--text-2); line-height:1.6; }
.quote { display:block; font-family:'Patrick Hand',cursive; font-size:.95rem; color:var(--accent); margin-top:.5rem; }
.week-dots-wrap { margin-top:1rem; }
.week-dots-wrap label { display:block; font-size:.68rem; color:var(--text-2); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:.45rem; }
.week-dots { display:flex; gap:7px; flex-wrap:wrap; }

/* STREAK FLAME WIDGET */
.streak-wrap {
  width: 115px; height: 115px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
}
.streak-flame-svg {
  display: block; overflow: visible;
  filter: drop-shadow(0 0 14px rgba(56,189,248,0.55)) drop-shadow(0 0 30px rgba(56,189,248,0.25));
}

/* Flame flicker animations */
@keyframes flicker1 {
  0%,100% { d: path("M57.5 18 C57.5 18 72 30 72 48 C72 62 66 70 57.5 74 C49 70 43 62 43 48 C43 30 57.5 18 57.5 18Z"); transform: scaleX(1); }
  25%      { d: path("M57.5 16 C57.5 16 74 29 73 49 C72 63 65 71 57.5 74 C50 71 43 63 42 49 C41 29 57.5 16 57.5 16Z"); transform: scaleX(1.03); }
  50%      { d: path("M57.5 20 C57.5 20 70 31 71 47 C71 61 65 69 57.5 74 C50 69 44 61 44 47 C44 31 57.5 20 57.5 20Z"); transform: scaleX(0.97); }
  75%      { d: path("M57.5 17 C57.5 17 73 30 72 48 C72 62 65 70 57.5 74 C50 70 43 62 43 48 C43 30 57.5 17 57.5 17Z"); transform: scaleX(1.02); }
}
@keyframes flicker2 {
  0%,100% { d: path("M57.5 30 C57.5 30 67 38 67 51 C67 60 63 66 57.5 69 C52 66 48 60 48 51 C48 38 57.5 30 57.5 30Z"); }
  33%      { d: path("M57.5 28 C57.5 28 68 37 68 52 C68 61 63 67 57.5 69 C52 67 47 61 47 52 C47 37 57.5 28 57.5 28Z"); }
  66%      { d: path("M57.5 32 C57.5 32 66 40 66 50 C66 59 62 65 57.5 69 C53 65 49 59 49 50 C49 40 57.5 32 57.5 32Z"); }
}
@keyframes flicker3 {
  0%,100% { d: path("M57.5 42 C57.5 42 63 47 63 54 C63 59 61 62 57.5 64 C54 62 52 59 52 54 C52 47 57.5 42 57.5 42Z"); }
  50%      { d: path("M57.5 40 C57.5 40 64 46 64 53 C64 58 61 61 57.5 63 C54 61 51 58 51 53 C51 46 57.5 40 57.5 40Z"); }
}
@keyframes flameGlow {
  0%,100% { opacity: 0.7; }
  50%      { opacity: 1; }
}
@keyframes flamePulse {
  0%,100% { transform: scaleY(1) scaleX(1); }
  30%      { transform: scaleY(1.04) scaleX(0.97); }
  60%      { transform: scaleY(0.97) scaleX(1.02); }
}
.flame-outer { animation: flamePulse 2.1s ease-in-out infinite; transform-origin: center bottom; }
.flame-mid   { animation: flamePulse 1.8s ease-in-out infinite 0.3s; transform-origin: center bottom; }
.flame-inner { animation: flamePulse 1.5s ease-in-out infinite 0.6s; transform-origin: center bottom; }
@keyframes streakCountUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.streak-count {
  font-family: 'Patrick Hand', cursive; font-size: 1.55rem;
  fill: #e0f2fe; text-anchor: middle; dominant-baseline: middle;
  filter: drop-shadow(0 0 6px rgba(56,189,248,0.8));
}
.streak-sublbl {
  font-family: 'Patrick Hand', cursive; font-size: 9.5px;
  fill: #7dd3fc; text-anchor: middle; dominant-baseline: middle;
}
.wd { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
.wd:hover .wd-dot { transform:scale(1.25); }
.wd-dot { width:13px; height:13px; border-radius:50%; background:var(--dot-off); transition:background var(--tr),transform var(--tr),box-shadow .2s; }
.wd-dot.on { background:var(--dot-on); transform:scale(1.3); }
.wd-dot.now { box-shadow:0 0 0 2.5px var(--accent); }
.wd-dot.viewing { box-shadow:0 0 0 2.5px var(--accent3)!important; transform:scale(1.45)!important; }
.wd span { font-size:.6rem; color:var(--text-2); font-weight:700; transition:color .2s; }
.wd.is-viewing span { color:var(--accent3); }

/* SECTION CARD */
.section-card { padding:1.5rem 1.5rem 1.3rem; }
.section-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.1rem; gap:.5rem; flex-wrap:wrap; }
.section-title { font-family:'Patrick Hand',cursive; font-size:1.25rem; color:var(--text-1); display:flex; align-items:center; gap:.45rem; }
.section-title svg { flex-shrink:0; }

/* FORMS */
.add-row { display:flex; gap:.5rem; margin-bottom:.9rem; }
.add-row input { flex:1; padding:.56rem 1rem; border-radius:50px; border:1px solid var(--input-border); background:var(--input-bg); color:var(--text-1); font-family:'Patrick Hand',cursive; font-size:.95rem; outline:none; transition:border-color var(--tr); }
.add-row input:focus { border-color:var(--accent); }
.add-row input::placeholder { color:var(--text-2); }
.btn { padding:.56rem 1.2rem; border-radius:50px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-family:'Patrick Hand',cursive; font-size:.95rem; border:none; cursor:pointer; white-space:nowrap; transition:transform .15s,box-shadow .15s; box-shadow:0 2px 12px rgba(0,0,0,.25); }
.btn:hover { transform:scale(1.05); box-shadow:0 4px 22px rgba(0,0,0,.35); }
.btn:active { transform:scale(.97); }
.icon-btn { background:transparent; color:var(--text-2); padding:.28rem .52rem; font-size:.85rem; box-shadow:none; border-radius:8px; display:flex; align-items:center; justify-content:center; }
.icon-btn:hover { color:var(--accent); background:var(--glass-hover); transform:scale(1.1); }
.del-btn { color:var(--del)!important; }
.del-btn:hover { background:rgba(244,114,182,.1)!important; }

/* ── DAY NAVIGATION ── */
.day-nav { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; }
.dnav-btn { background:var(--input-bg); border:1px solid var(--input-border); border-radius:50px; color:var(--text-2); font-family:'Patrick Hand',cursive; font-size:.8rem; padding:.28rem .75rem; cursor:pointer; display:flex; align-items:center; gap:.3rem; transition:all .2s; flex-shrink:0; }
.dnav-btn:hover:not(:disabled) { border-color:var(--accent3); color:var(--accent3); background:rgba(34,211,238,.07); }
.dnav-btn:disabled { opacity:.3; cursor:default; }
.dnav-label { flex:1; text-align:center; font-family:'Patrick Hand',cursive; font-size:.82rem; color:var(--text-2); transition:color .2s; }
.dnav-label.past { color:var(--accent3); }
.dnav-back { background:linear-gradient(135deg,var(--accent3),#0e7490)!important; border-color:transparent!important; color:#fff!important; font-size:.74rem; padding:.26rem .65rem; display:none; }
.dnav-back.show { display:flex; }

/* READONLY NOTICE */
.readonly-notice { display:none; align-items:center; gap:.45rem; background:rgba(34,211,238,.07); border:1px solid rgba(34,211,238,.22); border-radius:12px; padding:.4rem .85rem; margin-bottom:.75rem; font-family:'Patrick Hand',cursive; font-size:.8rem; color:var(--accent3); }
.readonly-notice.show { display:flex; }

/* HABIT ITEM */
.habit-list { display:flex; flex-direction:column; gap:.65rem; min-height:10px; }
.habit-item { display:flex; align-items:center; gap:.75rem; padding:.7rem .9rem; border-radius:16px; background:var(--input-bg); border:1px solid var(--input-border); cursor:grab; position:relative; overflow:hidden; transition:background var(--tr),border-color var(--tr),transform .2s ease,box-shadow .2s ease; }
.habit-item:hover { background:var(--glass-hover); border-color:var(--accent); transform:translateX(4px); box-shadow:0 4px 18px var(--glass-shadow); }
.habit-item.is-done .h-name { text-decoration:line-through; color:var(--text-2); }
.habit-item.is-done { opacity:.7; }
.habit-item.dragging { opacity:.35; cursor:grabbing; }
.habit-item.drag-over { border-color:var(--accent2); transform:scale(1.025); }
.habit-item.past-done { opacity:.65; }
.habit-item.past-done .h-name { text-decoration:line-through; color:var(--text-2); }
.habit-item.shimmer::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent); animation:shimmer .65s ease-out forwards; pointer-events:none; }
@keyframes shimmer { 0%{transform:translateX(-120%)} 100%{transform:translateX(120%)} }
.h-toggle { flex-shrink:0; width:26px; height:26px; border-radius:50%; border:2px solid var(--accent); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent; transition:background var(--tr),color var(--tr),transform .2s; }
.h-toggle.on { background:var(--accent); color:#fff; }
.h-toggle:hover { transform:scale(1.15); }
.h-toggle.ro { cursor:default; pointer-events:none; opacity:.7; }
.h-info { flex:1; min-width:0; }
.h-name { font-family:'Patrick Hand',cursive; font-size:1rem; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color var(--tr); }
.h-name-input { font-family:'Patrick Hand',cursive; font-size:1rem; background:transparent; border:none; border-bottom:1.5px solid var(--accent); color:var(--text-1); outline:none; width:100%; }
.h-meta { display:flex; gap:.45rem; align-items:center; font-size:.7rem; color:var(--text-2); margin-top:2px; }
.streak { color:var(--gold); font-weight:700; font-family:'Patrick Hand',cursive; display:flex; align-items:center; gap:3px; }
.h-actions { display:flex; gap:.15rem; flex-shrink:0; align-items:center; }
.drag-handle { color:var(--text-2); font-size:1rem; padding:0 4px; opacity:.3; transition:opacity .2s; user-select:none; cursor:grab; }
.habit-item:hover .drag-handle { opacity:.75; }
.past-badge { font-size:.7rem; font-family:'Patrick Hand',cursive; padding:.2rem .5rem; border-radius:8px; flex-shrink:0; }
.past-badge.done { color:var(--accent3); background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.2); }
.past-badge.miss { color:var(--del); background:rgba(244,114,182,.08); border:1px solid rgba(244,114,182,.15); }

/* TODO */
.todo-hd-row { display:flex; align-items:center; gap:.8rem; }
.todo-item { display:flex; align-items:center; gap:.7rem; padding:.55rem .85rem; border-radius:14px; background:var(--input-bg); border:1px solid var(--input-border); margin-bottom:.55rem; transition:background var(--tr),border-color var(--tr),transform .2s; }
.todo-item:hover { background:var(--glass-hover); border-color:var(--todo-ring); transform:translateX(4px); }
.todo-item.arrives-today { border-color:rgba(34,211,238,.4); background:rgba(34,211,238,.05); }
.t-toggle { flex-shrink:0; width:22px; height:22px; border-radius:5px; border:2px solid var(--todo-ring); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; transition:background var(--tr),color var(--tr); }
.t-toggle.on { background:var(--todo-ring); color:#fff; }
.t-text { flex:1; font-family:'Patrick Hand',cursive; font-size:.95rem; color:var(--text-1); transition:color var(--tr); }
.t-text.done { text-decoration:line-through; color:var(--text-2); }
.t-badge { font-size:.65rem; color:var(--accent3); background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.2); border-radius:6px; padding:1px 6px; font-family:'Patrick Hand',cursive; flex-shrink:0; }

/* ANALYSIS */
.analysis-section { padding:1.5rem 1.5rem 1.8rem; }
.analysis-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.4rem; flex-wrap:wrap; gap:.8rem; }
.analysis-title { font-family:'Patrick Hand',cursive; font-size:1.25rem; color:var(--text-1); display:flex; align-items:center; gap:.5rem; }
.period-toggle { display:flex; gap:.35rem; background:rgba(255,255,255,.05); border-radius:50px; padding:4px; border:1px solid var(--input-border); }
.period-btn { padding:.32rem .85rem; border-radius:50px; border:none; background:transparent; color:var(--text-2); font-family:'Patrick Hand',cursive; font-size:.88rem; cursor:pointer; transition:all .22s; white-space:nowrap; }
.period-btn.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 2px 10px rgba(222,81,81,.4); }
.period-btn:hover:not(.active) { color:var(--text-1); background:rgba(255,255,255,.08); }
.chart-area { position:relative; }
.chart-panel { display:none; }
.chart-panel.active { display:block; }
.svg-chart { width:100%; overflow:hidden; display:block; max-width:100%; }
.chart-axis-label { font-family:'Patrick Hand',cursive; fill:var(--text-2); font-size:11px; }
.chart-grid-line { stroke:rgba(255,255,255,.06); stroke-width:1; }
.stats-row { display:flex; gap:.8rem; margin-top:1.2rem; flex-wrap:wrap; }
.stat-chip { flex:1; min-width:80px; background:var(--input-bg); border:1px solid var(--input-border); border-radius:14px; padding:.6rem .9rem; text-align:center; }
.stat-chip .stat-val { font-family:'Patrick Hand',cursive; font-size:1.45rem; color:var(--text-1); line-height:1; }
.stat-chip .stat-lbl { font-size:.62rem; color:var(--text-2); text-transform:uppercase; letter-spacing:.07em; margin-top:2px; }
.stat-chip.chip-accent .stat-val { color:var(--accent); }
.stat-chip.chip-gold .stat-val { color:var(--gold); }
.stat-chip.chip-cyan .stat-val { color:var(--accent3); }
.stat-chip.chip-purple .stat-val { color:#a855f7; }
.trend-path { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.trend-area { opacity:.18; }
.trend-dot { transition:r .15s; cursor:pointer; }
.chart-tooltip { position:absolute; background:rgba(16,9,30,.95); border:1px solid var(--glass-border); border-radius:10px; padding:.4rem .7rem; font-family:'Patrick Hand',cursive; font-size:.82rem; color:var(--text-1); pointer-events:none; opacity:0; transition:opacity .2s; white-space:nowrap; z-index:10; }

/* EMPTY */
.empty { text-align:center; padding:1.6rem 0; color:var(--text-2); font-family:'Patrick Hand',cursive; font-size:.95rem; }

/* ANIMATIONS */
@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
.fade-up { animation:fadeUp .45s cubic-bezier(.4,0,.2,1) both; }
@keyframes popIn { 0%{opacity:0;transform:scale(.75)} 65%{transform:scale(1.06)} 100%{opacity:1;transform:scale(1)} }
.pop { animation:popIn .35s cubic-bezier(.4,0,.2,1) both; }

#confetti { position:fixed; inset:0; pointer-events:none; z-index:9999; display:none; }
#toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(120px); background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:.65rem 1.6rem; border-radius:50px; font-family:'Patrick Hand',cursive; font-size:1rem; box-shadow:0 6px 28px rgba(0,0,0,.4); z-index:9998; pointer-events:none; backdrop-filter:blur(12px); transition:transform .4s cubic-bezier(.4,0,.2,1); }
#toast.show { transform:translateX(-50%) translateY(0); }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

/* ── BACKUP PANEL ── */
.backup-wrap { position:relative; }
.backup-btn {
  display:flex; align-items:center; gap:.45rem;
  padding:.4rem .9rem; border-radius:50px;
  border:1px solid rgba(168,85,247,.4);
  background:rgba(168,85,247,.08);
  color:#c084fc; font-family:'Patrick Hand',cursive; font-size:.82rem;
  cursor:pointer; transition:all .22s; white-space:nowrap;
}
.backup-btn:hover { background:rgba(168,85,247,.18); border-color:rgba(168,85,247,.7); color:#e879f9; transform:scale(1.04); }
.backup-btn svg { flex-shrink:0; }

/* auto-save pulse dot */
.backup-pulse {
  width:7px; height:7px; border-radius:50%;
  background:#a855f7; flex-shrink:0;
  box-shadow:0 0 6px #a855f7;
  animation:bkpulse 2.4s ease-in-out infinite;
}
@keyframes bkpulse {
  0%,100% { opacity:.5; transform:scale(1); }
  50%      { opacity:1;  transform:scale(1.35); }
}
.backup-pulse.saved { background:#22d3ee; box-shadow:0 0 6px #22d3ee; animation:none; opacity:1; }

/* dropdown panel — z:400 so it sits above the overlay at z:300 */
.backup-dropdown {
  position:fixed; top:60px; right:20px;
  width:310px; z-index:9000;
  background:rgba(10,7,22,0.97);
  backdrop-filter:blur(32px) saturate(2.2); -webkit-backdrop-filter:blur(32px) saturate(2.2);
  border:1px solid rgba(168,85,247,.4); border-radius:20px;
  box-shadow:0 28px 70px rgba(0,0,0,.8),0 0 0 1px rgba(168,85,247,.1),0 0 40px rgba(168,85,247,.06);
  padding:1.3rem; opacity:0; transform:translateY(-12px) scale(.96);
  pointer-events:none; transition:opacity .25s cubic-bezier(.4,0,.2,1),transform .25s cubic-bezier(.4,0,.2,1);
}
.backup-dropdown.open { opacity:1; transform:translateY(0) scale(1); pointer-events:all; }

.bk-hd { font-family:'Patrick Hand',cursive; font-size:1rem; color:var(--text-1);
  display:flex; align-items:center; gap:.45rem;
  border-bottom:1px solid rgba(255,255,255,.07); padding-bottom:.75rem; margin-bottom:.9rem; }

.bk-status {
  display:flex; align-items:center; gap:.6rem;
  background:var(--input-bg); border:1px solid var(--input-border);
  border-radius:12px; padding:.55rem .8rem; margin-bottom:.85rem;
  font-family:'Patrick Hand',cursive; font-size:.8rem; color:var(--text-2);
}
.bk-status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.bk-status-dot.ok  { background:#22d3ee; box-shadow:0 0 6px #22d3ee; }
.bk-status-dot.warn { background:#fbbf24; box-shadow:0 0 6px #fbbf24; }
.bk-status-info { flex:1; }
.bk-status-info strong { display:block; color:var(--text-1); font-size:.82rem; }

.bk-row { display:flex; gap:.5rem; margin-bottom:.5rem; }
.bk-action-btn {
  flex:1; display:flex; align-items:center; justify-content:center; gap:.4rem;
  padding:.52rem .6rem; border-radius:12px; border:none; cursor:pointer;
  font-family:'Patrick Hand',cursive; font-size:.88rem; transition:all .18s;
}
.bk-export { background:linear-gradient(135deg,#a855f7,#7c3aed); color:#fff; box-shadow:0 2px 12px rgba(168,85,247,.3); }
.bk-export:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(168,85,247,.5); }
.bk-import { background:linear-gradient(135deg,#22d3ee,#0e7490); color:#fff; box-shadow:0 2px 12px rgba(34,211,238,.25); }
.bk-import:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(34,211,238,.45); }
.bk-restore { background:linear-gradient(135deg,#fbbf24,#d97706); color:#1a1000; box-shadow:0 2px 12px rgba(251,191,36,.25); font-size:.8rem; }
.bk-restore:hover { transform:scale(1.02); box-shadow:0 4px 20px rgba(251,191,36,.4); }

/* auto-backup interval selector */
.bk-auto-row { display:flex; align-items:center; gap:.55rem; margin-top:.65rem; padding-top:.65rem; border-top:1px solid rgba(255,255,255,.07); }
.bk-auto-lbl { font-family:'Patrick Hand',cursive; font-size:.78rem; color:var(--text-2); flex:1; }
.bk-auto-sel {
  background:var(--input-bg); border:1px solid var(--input-border);
  color:var(--text-1); font-family:'Patrick Hand',cursive; font-size:.8rem;
  border-radius:8px; padding:.3rem .5rem; outline:none; cursor:pointer;
  transition:border-color var(--tr);
}
.bk-auto-sel:focus { border-color:#a855f7; }

/* history list */
.bk-history { margin-top:.75rem; max-height:120px; overflow-y:auto; }
.bk-history-lbl { font-size:.63rem; color:var(--text-2); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:.4rem; }
.bk-hist-item { display:flex; align-items:center; gap:.5rem; padding:.32rem .55rem; border-radius:9px; background:var(--input-bg); border:1px solid var(--input-border); margin-bottom:.28rem; }
.bk-hist-time { font-family:'Patrick Hand',cursive; font-size:.72rem; color:var(--accent3); flex-shrink:0; }
.bk-hist-info { flex:1; font-family:'Patrick Hand',cursive; font-size:.76rem; color:var(--text-2); }
.bk-hist-restore { background:none; border:none; color:#a855f7; cursor:pointer; font-size:.72rem; font-family:'Patrick Hand',cursive; padding:0 3px; opacity:.7; transition:opacity .15s; }
.bk-hist-restore:hover { opacity:1; }

/* ── SUB-HABITS ── */
.subhabit-expand-btn {
  background:none; border:none; cursor:pointer;
  color:var(--text-2); padding:0 3px; display:flex; align-items:center;
  transition:color .2s, transform .25s;
  flex-shrink:0;
}
.subhabit-expand-btn:hover { color:var(--accent3); }
.subhabit-expand-btn.open { color:var(--accent3); transform:rotate(90deg); }

.subhabit-panel {
  display:none; flex-direction:column; gap:.35rem;
  margin-top:.55rem; padding-top:.55rem;
  border-top:1px solid rgba(255,255,255,.07);
}
.subhabit-panel.open { display:flex; }

.subhabit-progress {
  height:3px; border-radius:2px;
  background:var(--track); margin-bottom:.1rem; overflow:hidden;
}
.subhabit-progress-bar {
  height:100%; border-radius:2px;
  background:linear-gradient(90deg,var(--accent3),#0ea5e9);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

.subhabit-row {
  display:flex; align-items:center; gap:.5rem;
  padding:.28rem .45rem; border-radius:9px;
  background:rgba(255,255,255,.03);
  transition:background .18s;
}
.subhabit-row:hover { background:rgba(255,255,255,.07); }

.sub-toggle {
  width:18px; height:18px; border-radius:4px; flex-shrink:0;
  border:1.5px solid rgba(34,211,238,.5); background:transparent;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:11px; color:transparent;
  transition:background .18s, color .18s, border-color .18s;
}
.sub-toggle.on { background:rgba(34,211,238,.25); border-color:var(--accent3); color:var(--accent3); }
.sub-toggle.ro { pointer-events:none; cursor:default; opacity:.7; }

.sub-name {
  flex:1; font-family:'Patrick Hand',cursive; font-size:.82rem;
  color:var(--text-2); transition:color .18s;
}
.sub-name.done { text-decoration:line-through; opacity:.5; }

.sub-del {
  background:none; border:none; color:var(--del);
  cursor:pointer; padding:0 2px; opacity:0;
  transition:opacity .15s; display:flex; align-items:center;
}
.subhabit-row:hover .sub-del { opacity:.6; }
.sub-del:hover { opacity:1!important; }

.sub-count-badge {
  font-size:.62rem; font-family:'Patrick Hand',cursive;
  color:var(--accent3); background:rgba(34,211,238,.1);
  border:1px solid rgba(34,211,238,.2); border-radius:6px;
  padding:1px 5px; flex-shrink:0;
}

.add-sub-row {
  display:flex; gap:.35rem; margin-top:.3rem;
}
.add-sub-inp {
  flex:1; padding:.3rem .65rem; border-radius:8px;
  border:1px solid var(--input-border); background:var(--input-bg);
  color:var(--text-1); font-family:'Patrick Hand',cursive; font-size:.8rem;
  outline:none; transition:border-color .18s;
}
.add-sub-inp:focus { border-color:var(--accent3); }
.add-sub-inp::placeholder { color:var(--text-2); }
.add-sub-btn {
  padding:.3rem .7rem; border-radius:8px;
  background:linear-gradient(135deg,var(--accent3),#0e7490);
  color:#fff; border:none; cursor:pointer;
  font-family:'Patrick Hand',cursive; font-size:.8rem;
  transition:transform .15s;
}
.add-sub-btn:hover { transform:scale(1.05); }

/* habit-item when expanded — show sub-panel below */
.habit-item-wrap {
  display:flex; flex-direction:column;
  border-radius:16px;
  background:var(--input-bg); border:1px solid var(--input-border);
  transition:background var(--tr), border-color var(--tr), transform .2s ease, box-shadow .2s ease;
  position:relative; overflow:hidden;
}
.habit-item-wrap:hover {
  background:var(--glass-hover); border-color:var(--accent);
  transform:translateX(4px); box-shadow:0 4px 18px var(--glass-shadow);
}
.habit-item-wrap.is-done .h-name { text-decoration:line-through; color:var(--text-2); }
.habit-item-wrap.is-done { opacity:.7; }
.habit-item-wrap.dragging { opacity:.35; cursor:grabbing; }
.habit-item-wrap.drag-over { border-color:var(--accent2); transform:scale(1.025); }
.habit-item-wrap.past-done { opacity:.65; }
.habit-item-wrap.past-done .h-name { text-decoration:line-through; color:var(--text-2); }
.habit-item-wrap.shimmer::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  animation:shimmer .65s ease-out forwards; pointer-events:none;
}
.habit-main-row {
  display:flex; align-items:center; gap:.75rem;
  padding:.7rem .9rem; cursor:grab;
}

/* ═══════════════════════════════════
   MOBILE RESPONSIVE  ≤ 600px
═══════════════════════════════════ */
@media (max-width: 600px) {

  /* ── Smooth scrolling & eliminate white glare ── */
  html, body {
    -webkit-overflow-scrolling: touch;
    -webkit-backface-visibility: hidden;
    -webkit-perspective: 1000;
  }
  body {
    background-attachment: scroll !important;
    overflow-y: scroll;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
  }

  /* ── Layout ── */
  .wrap { padding: 1rem .75rem 4rem; }
  .grid { grid-template-columns: 1fr; gap: 1rem; }

  /* ── Header ── */
  header { gap: .6rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .brand-text h1 { font-size: 1.55rem; }
  .brand-text p { font-size: .7rem; }
  .header-right { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }

  /* Date pill takes full width on left, backup button on right */
  .date-pill-wrap { flex: 1; }
  .date-pill-btn { width: 100%; font-size: .75rem; padding: .38rem .8rem; }
  #datePillText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
  .backup-btn { font-size: .75rem; padding: .38rem .7rem; }
  .backup-btn span:not(.backup-pulse) { display: none; } /* hide "Backup" text, keep icon + pulse */

  /* Dropdowns: full width on mobile */
  .schedule-dropdown,
  .backup-dropdown {
    width: calc(100vw - 1.5rem) !important;
    left: .75rem !important;
    right: .75rem !important;
    max-height: 80vh;
    overflow-y: auto;
  }

  /* ── Overview card: stack ring + text + flame vertically ── */
  .overview-card {
    padding: 1.2rem 1rem;
    grid-template-columns: 1fr !important;
    gap: .8rem;
    justify-items: center;
    text-align: center;
  }
  /* Side-by-side ring & flame on mobile */
  .overview-card .ring-wrap,
  .overview-card .streak-wrap {
    width: 90px; height: 90px;
  }
  .overview-card .ring-wrap svg,
  .overview-card .streak-flame-svg {
    width: 90px !important; height: 90px !important;
  }
  /* Put ring and flame side by side */
  .overview-card {
    grid-template-columns: 90px 1fr 90px !important;
    gap: .6rem;
  }
  .ov-info { text-align: center; min-width: 0; }
  .ov-info h2 { font-size: 1.15rem; }
  .ov-info p { font-size: .78rem; }
  .quote { font-size: .82rem; }
  .week-dots { justify-content: center; }
  .week-dots-wrap label { font-size: .58rem; }

  /* ── Section cards ── */
  .section-card { padding: 1rem 1rem .9rem; }
  .analysis-section { padding: 1rem 1rem 1.2rem; }

  /* ── Section header ── */
  .section-hd { flex-wrap: wrap; gap: .4rem; }
  .section-title { font-size: 1.05rem; }

  /* ── Todo header ring + title ── */
  .todo-hd-row { gap: .55rem; }
  .todo-hd-row svg[width="52"] { width: 42px !important; height: 42px !important; }

  /* ── Add row ── */
  .add-row input { font-size: .88rem; padding: .48rem .85rem; }
  .btn { font-size: .85rem; padding: .48rem .9rem; }

  /* ── Day nav ── */
  .day-nav { gap: .35rem; }
  .dnav-btn { font-size: .72rem; padding: .24rem .55rem; }
  .dnav-label { font-size: .74rem; }
  .dnav-back { font-size: .68rem; padding: .22rem .5rem; }

  /* ── Habit items ── */
  .habit-main-row { gap: .5rem; padding: .55rem .65rem; }
  .drag-handle { display: none; } /* hide on touch — drag not useful on mobile */
  .h-name { font-size: .92rem; }
  .h-meta { font-size: .65rem; gap: .3rem; }
  .h-actions { gap: .05rem; }
  .icon-btn { padding: .22rem .38rem; }
  .sub-count-badge { font-size: .58rem; padding: 1px 4px; }
  .past-badge { font-size: .62rem; padding: .15rem .4rem; }

  /* ── Subhabit panel ── */
  .subhabit-panel { padding-left: .3rem; padding-right: .3rem; }
  .add-sub-row { gap: .25rem; }
  .add-sub-inp { font-size: .78rem; padding: .28rem .55rem; }
  .add-sub-btn { font-size: .78rem; padding: .28rem .55rem; }

  /* ── Analytics ── */
  .analysis-hd { flex-direction: column; align-items: flex-start; gap: .6rem; }
  .analysis-hd > div { width: 100%; justify-content: space-between; }
  .period-toggle { width: 100%; justify-content: stretch; }
  .period-btn { flex: 1; text-align: center; font-size: .78rem; padding: .28rem .4rem; }
  .svg-chart { overflow: hidden; }
  .stats-row { gap: .4rem; }
  .stat-chip { min-width: 60px; padding: .45rem .5rem; }
  .stat-chip .stat-val { font-size: 1.15rem; }
  .stat-chip .stat-lbl { font-size: .55rem; }

  /* ── Toast ── */
  #toast { font-size: .85rem; padding: .5rem 1.2rem; bottom: 1.2rem; }

  /* Disable lift-hover animations on mobile (they feel wrong on touch) */
  .glass:hover { transform: none; }
  .habit-item-wrap:hover { transform: none; }
  .todo-item:hover { transform: none; }
}

/* ── Very small phones ≤ 380px ── */
@media (max-width: 380px) {
  .overview-card {
    grid-template-columns: 75px 1fr 75px !important;
    gap: .4rem;
    padding: 1rem .75rem;
  }
  .overview-card .ring-wrap,
  .overview-card .streak-wrap { width: 75px; height: 75px; }
  .overview-card .ring-wrap svg,
  .overview-card .streak-flame-svg { width: 75px !important; height: 75px !important; }
  .ov-info h2 { font-size: 1rem; }
  .date-pill-btn { font-size: .7rem; padding: .32rem .65rem; }
  #datePillText { max-width: 100px; }
  .backup-btn { padding: .32rem .55rem; }
  .period-btn { font-size: .7rem; }
}

  </style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<!-- overlays replaced with document click handler -->

<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <svg class="brand-icon" width="38" height="38" viewBox="0 0 38 38" fill="none">
        <circle cx="19" cy="19" r="18" fill="rgba(222,81,81,0.12)" stroke="rgba(222,81,81,0.3)" stroke-width="1"/>
        <path d="M19 28V18" stroke="#de5151" stroke-width="2" stroke-linecap="round"/>
        <path d="M19 22C19 22 14 20 12 15C14 13 19 14 19 18" fill="#22d3ee" fill-opacity="0.7" stroke="#22d3ee" stroke-width="1" stroke-linejoin="round"/>
        <path d="M19 19C19 19 23 17 25 12C22 11 18 13 19 17" fill="#a855f7" fill-opacity="0.7" stroke="#a855f7" stroke-width="1" stroke-linejoin="round"/>
        <path d="M17 28H21" stroke="#de5151" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="brand-text"><h1>HabitFlow</h1><p>Your daily ritual tracker</p></div>
    </div>
    <div class="header-right">

      <!-- DATE PILL — click to open scheduler -->
      <div class="date-pill-wrap">
        <button class="date-pill-btn" id="datePillBtn" onclick="toggleScheduler(event)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="1.5" y="2" width="11" height="10.5" rx="2" stroke="var(--accent3)" stroke-width="1.2"/>
            <path d="M4.5 1V3M9.5 1V3" stroke="var(--accent3)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1.5 5.5H12.5" stroke="var(--accent3)" stroke-width="1.2"/>
          </svg>
          <span id="datePillText" style="flex:1;text-align:left"></span>
          <svg class="date-pill-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M3 4.5L6 7.5L9 4.5" stroke="var(--text-2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- SCHEDULER DROPDOWN -->
        <div class="schedule-dropdown" id="schedDropdown" onclick="event.stopPropagation()">
          <div class="sched-hd">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">

<script>
/* ═══════════════════════════════════
   CONSTANTS
═══════════════════════════════════ */
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const QUOTES = [
  'Small steps every day','Consistency beats perfection',
  "You're doing great — keep going!",'Build the life you want',
  'Every checked box counts','Habits shape your future',
  'One habit at a time','Progress, not perfection',
];

/* ── utils ── */
const todayStr = () => new Date().toISOString().slice(0,10);
const $        = id  => document.getElementById(id);
const esc      = s   => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate  = ds  => { const d=new Date(ds+'T12:00:00'); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const addDays  = (ds,n) => { const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const greeting = () => { const h=new Date().getHours(); return h<12?'Good morning!':h<17?'Good afternoon!':'Good evening!'; };
const last7    = () => Array.from({length:7},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toISOString().slice(0,10); });
const lastN    = n   => Array.from({length:n},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(n-1-i)); return d.toISOString().slice(0,10); });

/* ── state ── */
let S = { habits:[], todos:[], history:{}, scheduled:[] };
let viewOffset = 0; // 0 = today, -1 = yesterday, etc.

const viewDateStr = () => { const d=new Date(); d.setDate(d.getDate()+viewOffset); return d.toISOString().slice(0,10); };
const isToday     = () => viewOffset === 0;

/* ── load / save ── */
function load(){
  try{ const r=localStorage.getItem('hf4'); if(r) S=JSON.parse(r); }catch(e){}
  S.habits    = (S.habits||[]).map(h=>({streak:0,bestStreak:0,completions:{},lastDate:null,steps:[],...h}));
  S.todos     = S.todos   || [];
  S.history   = S.history || {};
  S.scheduled = S.scheduled || [];
}
function save(){
  S.history[todayStr()] = overallPct();
  localStorage.setItem('hf4', JSON.stringify(S));
}

/* ── calcs ── */
function overallPct(ds){
  const d=ds||todayStr();
  if(!S.habits.length) return 0;
  return Math.round(S.habits.filter(h=>h.completions[d]).length/S.habits.length*100);
}
function todoPct(){
  const visible=visibleTodos();
  if(!visible.length) return 0;
  return Math.round(visible.filter(t=>t.done).length/visible.length*100);
}
function pctForDate(d){ const td=todayStr(); return S.history[d]||(d===td?overallPct():0); }
function visibleTodos(){ const td=todayStr(); return S.todos.filter(t=>!t.scheduledFor||t.scheduledFor<=td); }

/* ── sound ── */
let ac;
function tone(freq=880,dur=.3,vol=.15){
  try{
    if(!ac) ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(freq,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*1.4,ac.currentTime+dur*.5);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
const chime   = () => { tone(660,.28); setTimeout(()=>tone(880,.28),110); };
const fanfare = () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.4),i*95)); };

/* ── confetti ── */
let cfRunning=false;
function confetti(){
  if(cfRunning) return; cfRunning=true;
  const cv=$('confetti'); cv.style.display='block';
  const ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#a855f7','#ec4899','#22d3ee','#fbbf24','#86efac','#f9a8d4'];
  const ps=Array.from({length:140},()=>({
    x:Math.random()*cv.width,y:-20,vx:(Math.random()-.5)*2.5,vy:Math.random()*3+1.5,
    r:Math.random()*7+3,color:cols[Math.floor(Math.random()*cols.length)],
    rot:Math.random()*360,rs:(Math.random()-.5)*4,alpha:1,shape:Math.random()>.45?'rect':'circle',
  }));
  let f=0;
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rs;
      if(f>150) p.alpha=Math.max(0,p.alpha-.011);
      ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;
      if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}
      else ctx.fillRect(-p.r,-p.r*.5,p.r*2,p.r);
      ctx.restore();
    });
    f++;
    if(f<245) requestAnimationFrame(frame);
    else{cv.style.display='none';cfRunning=false;}
  })();
}

function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3200);
}

/* ═══════════════════════════════════
   ICON HELPERS
═══════════════════════════════════ */
const iconFlame  = () => `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 12C4.79 12 3 10.21 3 8C3 5.5 5 4 5 4C5 4 4.5 6 7 6C9.5 6 10 4 10 4C10 4 11 5.5 11 8C11 10.21 9.21 12 7 12Z" fill="var(--gold)" stroke="var(--gold)" stroke-width="0.5"/></svg>`;
const iconEdit   = () => `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5L11.5 4.5L5 11L2.5 11.5L3 9L9.5 2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const iconTrash  = () => `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4H12M5 4V3H9V4M5 6V10M9 6V10M3 4L4 11H10L11 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const iconSeed   = () => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 22V14" stroke="#de5151" stroke-width="2" stroke-linecap="round"/><path d="M12 18C12 18 7 16 5 10C8 8 12 10 12 14" fill="#22d3ee" fill-opacity="0.6" stroke="#22d3ee" stroke-width="1.2"/><path d="M12 15C12 15 16 13 18 7C15 6 11 9 12 13" fill="#a855f7" fill-opacity="0.6" stroke="#a855f7" stroke-width="1.2"/></svg>`;
const iconCheck2 = () => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" stroke="#22d3ee" stroke-width="1.5" fill="rgba(34,211,238,0.08)"/><path d="M8 12L11 15L16 9" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function miniRing(pct){
  const r=14,c=18,circ=(2*Math.PI*r).toFixed(2),off=(circ-(pct/100)*circ).toFixed(2);
  const id='mr'+Math.random().toString(36).slice(2,8);
  return `<svg width="36" height="36" viewBox="0 0 36 36" style="display:block;overflow:visible"><circle fill="none" stroke="var(--track)" stroke-width="4" cx="${c}" cy="${c}" r="${r}"/><circle fill="none" stroke="url(#${id})" stroke-width="4" stroke-linecap="round" cx="${c}" cy="${c}" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 ${c} ${c})" style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/><defs><linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent2)"/></linearGradient></defs></svg>`;
}

/* ═══════════════════════════════════
   DAY NAVIGATION
═══════════════════════════════════ */
function shiftDay(delta){
  const next=viewOffset+delta;
  if(next>0) return;  // can't go future
  if(next<-30) return; // max 30 days back
  viewOffset=next;
  syncDayNav();
  renderHabits();
  renderOverview();
  renderWeekDots();
}

function goToday(){
  viewOffset=0;
  syncDayNav();
  renderHabits();
  renderOverview();
  renderWeekDots();
}

function syncDayNav(){
  const past=!isToday();
  const vd=viewDateStr();
  $('dayNavLabel').textContent=isToday()?'Today':fmtDate(vd);
  $('dayNavLabel').classList.toggle('past',past);
  $('nextDayBtn').disabled=isToday();
  $('prevDayBtn').disabled=viewOffset<=-30;
  $('todayBtn').classList.toggle('show',past);
  $('readonlyNotice').classList.toggle('show',past);
  $('habitAddRow').style.display=past?'none':'';
  // ring label
  $('bigLbl').textContent=isToday()?'today':fmtDate(vd).split(' ').slice(0,2).join(' ');
}

/* ═══════════════════════════════════
   SCHEDULER (date pill)
═══════════════════════════════════ */
let schedOpen=false;

function toggleScheduler(e){
  if(e) e.stopPropagation();
  if(schedOpen){ closeScheduler(); return; }
  if(backupOpen) closeBackup();
  schedOpen=true;
  const btn=$('datePillBtn');
  const rect=btn.getBoundingClientRect();
  const dd=$('schedDropdown');
  const isMobile=window.innerWidth<=600;
  if(isMobile){
    dd.style.top=(rect.bottom+6)+'px';
    dd.style.left='.75rem';
    dd.style.right='.75rem';
    dd.style.width='';
  } else {
    dd.style.top=(rect.bottom+8)+'px';
    dd.style.right=(window.innerWidth-rect.right)+'px';
    dd.style.left='';
    dd.style.width='330px';
  }
  dd.classList.add('open');
  $('datePillBtn').classList.add('open');
  const tom=addDays(todayStr(),1);
  $('schedDateIn').value=tom;
  $('schedDateIn').min=addDays(todayStr(),1);
  renderSchedList();
  setTimeout(()=>$('schedTaskIn').focus(),80);
}

function closeScheduler(){
  schedOpen=false;
  $('schedDropdown').classList.remove('open');
  $('datePillBtn').classList.remove('open');
}

function addScheduledTask(){
  const ti=$('schedTaskIn'),di=$('schedDateIn');
  const text=ti.value.trim(),date=di.value;
  if(!text){ ti.style.borderColor='var(--accent)'; ti.focus(); setTimeout(()=>ti.style.borderColor='',1000); return; }
  if(!date){ toast('Pick a date first!'); return; }
  if(date<=todayStr()){ toast('Date must be in the future!'); di.focus(); return; }
  S.todos.push({id:Date.now()+'',text,done:false,scheduledFor:date});
  ti.value='';
  // Reset date to tomorrow
  const tom=addDays(todayStr(),1);
  di.value=tom;
  save(); renderTodos(); renderSchedList();
  toast(`Scheduled for ${fmtDate(date)}!`);
  tone(440,.18); setTimeout(()=>tone(550,.18),100);
  ti.focus();
}

function removeScheduled(id){
  S.todos=S.todos.filter(t=>t.id!==id); save(); renderTodos(); renderSchedList();
}

function renderSchedList(){
  const el=$('schedList');
  const upcoming=S.todos.filter(t=>t.scheduledFor&&t.scheduledFor>todayStr())
    .sort((a,b)=>a.scheduledFor.localeCompare(b.scheduledFor));
  if(!upcoming.length){el.innerHTML='';return;}
  el.innerHTML=`<div class="sched-upcoming-lbl">Upcoming (${upcoming.length})</div>`+
    upcoming.map(t=>`<div class="sched-item">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x=".5" y="1" width="9" height="8.5" rx="1.8" stroke="var(--accent3)" stroke-width="1"/><path d="M2.5.5V2M7.5.5V2M.5 3.5H9.5" stroke="var(--accent3)" stroke-width=".9"/></svg>
      <span class="sched-date">${fmtDate(t.scheduledFor)}</span>
      <span class="sched-text">${esc(t.text)}</span>
      <button class="sched-del" onclick="removeScheduled('${t.id}')">${iconTrash()}</button>
    </div>`).join('');
}

$('schedTaskIn').addEventListener('keydown',e=>{if(e.key==='Enter')addScheduledTask();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(schedOpen) closeScheduler();
    if(backupOpen) closeBackup();
  }
});

// Close dropdowns when clicking anywhere outside them
document.addEventListener('click', function(e){
  if(schedOpen){
    const dd=$('schedDropdown');
    const btn=$('datePillBtn');
    if(dd && !dd.contains(e.target) && btn && !btn.contains(e.target)){
      closeScheduler();
    }
  }
  if(backupOpen){
    const dd=$('backupDropdown');
    const btn=$('backupBtn');
    if(dd && !dd.contains(e.target) && btn && !btn.contains(e.target)){
      closeBackup();
    }
  }
});

/* ═══════════════════════════════════
   CHART ENGINE
═══════════════════════════════════ */
function switchPeriod(period,btn){
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.chart-panel').forEach(p=>p.classList.remove('active'));
  $('panel-'+period).classList.add('active');
  renderAnalysis();
}

function renderAnalysis(){
  [['weekly',7],['biweekly',14],['monthly',30]].forEach(([p,n])=>{
    const dates=lastN(n);
    const data=dates.map(d=>({date:d,pct:pctForDate(d)}));
    drawChart(p,data,n);
    drawStats(p,data);
  });
}

function drawChart(period,data,days){
  const svgEl=$('chart-'+period);
  const W=860, H=period==='monthly'?170:160;
  svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const pL=38, pR=16, pT=14, pB=30;
  const cW=W-pL-pR, cH=H-pT-pB, n=data.length;
  const barGId=`bg-${period}`, lineGId=`lg-${period}`, avgGId=`ag-${period}`;
  let step=1; if(days===14)step=2; if(days===30)step=5;

  // Calculate rolling 3-day average for the line
  const movAvg=data.map((d,i)=>{
    const slice=data.slice(Math.max(0,i-2),i+1);
    return Math.round(slice.reduce((a,s)=>a+s.pct,0)/slice.length);
  });

  const barW=Math.max(4, (cW/n)*0.55);

  // Bar center x positions
  const xs=data.map((_,i)=>pL+(i/(n-1||1))*cW);

  // Average line points (centered on bars)
  const avgPts=movAvg.map((v,i)=>({x:xs[i], y:pT+cH-(v/100)*cH}));

  function smooth(ps){
    if(ps.length<2)return'';
    let d=`M ${ps[0].x} ${ps[0].y}`;
    for(let i=0;i<ps.length-1;i++){
      const c1x=ps[i].x+(ps[i+1].x-ps[i].x)*.4, c1y=ps[i].y;
      const c2x=ps[i].x+(ps[i+1].x-ps[i].x)*.6, c2y=ps[i+1].y;
      d+=` C ${c1x} ${c1y},${c2x} ${c2y},${ps[i+1].x} ${ps[i+1].y}`;
    }
    return d;
  }

  const avgLine=smooth(avgPts);
  const avgArea=avgLine+` L ${avgPts[avgPts.length-1].x} ${pT+cH} L ${avgPts[0].x} ${pT+cH} Z`;

  // Overall avg for coloring
  const overallAvg=Math.round(data.reduce((a,d)=>a+d.pct,0)/data.length);
  const lineCol=overallAvg>=70?'#22d3ee':overallAvg>=40?'#a855f7':'#de5151';

  // Grid
  let grid='';
  [0,25,50,75,100].forEach(v=>{
    const y=pT+cH-(v/100)*cH;
    grid+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" class="chart-grid-line"/>`;
    grid+=`<text x="${pL-5}" y="${y+4}" class="chart-axis-label" text-anchor="end">${v}</text>`;
  });

  // X labels
  let xlbls='';
  data.forEach((d,i)=>{
    if(i%step!==0&&i!==n-1)return;
    const dt=new Date(d.date+'T12:00:00');
    const lbl=days===7?DAYS[dt.getDay()]:days===14?`${MONTHS[dt.getMonth()]} ${dt.getDate()}`:`${dt.getDate()} ${MONTHS[dt.getMonth()]}`;
    xlbls+=`<text x="${xs[i]}" y="${H-6}" class="chart-axis-label" text-anchor="middle">${lbl}</text>`;
  });

  // Bars
  let bars='';
  data.forEach((d,i)=>{
    const x=xs[i]-barW/2;
    const barH=Math.max(3,(d.pct/100)*cH);
    const y=pT+cH-barH;
    const isToday_=d.date===todayStr();
    const col=isToday_?'url(#'+barGId+'-today)':'url(#'+barGId+')';
    const op=d.pct===0?0.18:1;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}"
      rx="3" fill="${col}" opacity="${op}" class="chart-bar"
      onmouseover="showTip(event,'${d.date}',${d.pct},${movAvg[i]})"
      onmouseout="hideTip()"
      style="cursor:pointer"/>`;
  });

  // Line dots
  let dots='';
  avgPts.forEach((p,i)=>{
    const isToday_=data[i].date===todayStr();
    dots+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isToday_?5.5:3.5}"
      fill="${isToday_?'var(--accent)':lineCol}"
      stroke="${isToday_?'rgba(222,81,81,.35)':'rgba(168,85,247,.3)'}"
      stroke-width="${isToday_?3:2}"
      class="trend-dot"
      onmouseover="showTip(event,'${data[i].date}',${data[i].pct},${movAvg[i]})"
      onmouseout="hideTip()"
    />`;
  });

  svgEl.innerHTML=`
    <defs>
      <linearGradient id="${barGId}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#a855f7" stop-opacity=".75"/>
        <stop offset="100%" stop-color="#7c3aed" stop-opacity=".3"/>
      </linearGradient>
      <linearGradient id="${barGId}-today" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".9"/>
        <stop offset="100%" stop-color="var(--accent2)" stop-opacity=".4"/>
      </linearGradient>
      <linearGradient id="${avgGId}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="${lineCol}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${lineCol}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}
    ${xlbls}
    ${bars}
    <path d="${avgArea}" fill="url(#${avgGId})"/>
    <path d="${avgLine}" stroke="${lineCol}" class="trend-path" stroke-width="2.2"/>
    ${dots}
  `;
}

function showTip(e,date,pct,avg){
  const tt=$('tooltip');
  const avgTxt=avg!==undefined&&avg!==pct?` · 3d avg: ${avg}%`:'';
  tt.textContent=`${fmtDate(date)} · ${pct}%${avgTxt}`;
  tt.style.opacity='1';
  const r=tt.parentElement.getBoundingClientRect();
  tt.style.left=(e.clientX-r.left+12)+'px';
  tt.style.top=(e.clientY-r.top-32)+'px';
}
function hideTip(){$('tooltip').style.opacity='0';}

function drawStats(period,data){
  const v=data.map(d=>d.pct);
  const avg=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;
  const best=v.length?Math.max(...v):0;
  const perfect=v.filter(x=>x===100).length;
  const zeros=v.filter(x=>x===0).length;
  const cons=v.length?Math.round(v.filter(x=>x>0).length/v.length*100):0;
  $('stats-'+period).innerHTML=`
    <div class="stat-chip chip-cyan"><div class="stat-val">${avg}%</div><div class="stat-lbl">Avg Score</div></div>
    <div class="stat-chip chip-gold"><div class="stat-val">${best}%</div><div class="stat-lbl">Best Day</div></div>
    <div class="stat-chip chip-accent"><div class="stat-val">${perfect}</div><div class="stat-lbl">Perfect Days</div></div>
    <div class="stat-chip chip-purple"><div class="stat-val">${cons}%</div><div class="stat-lbl">Consistency</div></div>
    <div class="stat-chip"><div class="stat-val">${zeros}</div><div class="stat-lbl">Missed Days</div></div>`;
}

/* ═══════════════════════════════════
   DRAG & DROP
═══════════════════════════════════ */
let dragIdx=null;
function dnd(el,i){
  el.draggable=true;
  el.addEventListener('dragstart',()=>{dragIdx=i;el.classList.add('dragging');});
  el.addEventListener('dragend',()=>el.classList.remove('dragging','drag-over'));
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
  el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drag-over');
    if(dragIdx!==null&&dragIdx!==i){
      const[m]=S.habits.splice(dragIdx,1);S.habits.splice(i,0,m);
      save();renderAll();
    }
  });
}

/* ═══════════════════════════════════
   RENDER FUNCTIONS
═══════════════════════════════════ */
function renderHabits(){
  const list=$('habitList'); list.innerHTML='';
  const vd=viewDateStr(); const past=!isToday();

  if(!S.habits.length){
    list.innerHTML=`<div class="empty">${iconSeed()}<br>No habits yet — add your first one!</div>`;
    return;
  }

  S.habits.forEach((h,i)=>{
    const done=!!h.completions[vd];
    const l7=last7(),cnt=l7.filter(d=>h.completions[d]).length;
    const wpct=Math.round(cnt/7*100);
    const steps=h.steps||[];
    const stepsDoneToday=steps.filter(s=>s.completions&&s.completions[vd]).length;
    const stepsPct=steps.length?Math.round(stepsDoneToday/steps.length*100):0;

    const wrap=document.createElement('div');
    wrap.className='habit-item-wrap pop'+(done?' is-done':'')+(past&&done?' past-done':'');
    wrap.dataset.id=h.id;

    const stepsExpId='steps-'+h.id;
    const stepsBadge=steps.length?`<span class="sub-count-badge">${stepsDoneToday}/${steps.length}</span>`:'';

    if(past){
      wrap.style.cursor='default';
      wrap.innerHTML=`
        <div class="habit-main-row" style="cursor:default">
          <span class="drag-handle" style="opacity:.12;pointer-events:none">⠿</span>
          <div>${miniRing(wpct)}</div>
          <button class="h-toggle${done?' on':''} ro">${done?'✓':''}</button>
          <div class="h-info">
            <div class="h-name">${esc(h.name)}</div>
            <div class="h-meta">
              <span class="streak">${iconFlame()} ${h.streak} day${h.streak!==1?'s':''}</span>
            </div>
          </div>
          ${stepsBadge}
          <span class="past-badge ${done?'done':'miss'}">${done?'Done':'Missed'}</span>
          ${steps.length?`<button class="subhabit-expand-btn" onclick="toggleSteps('${h.id}',this)" title="View steps"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 3L8.5 6.5L5 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`:''}
        </div>
        ${steps.length?`<div class="subhabit-panel" id="${stepsExpId}">
          <div class="subhabit-progress"><div class="subhabit-progress-bar" style="width:${stepsPct}%"></div></div>
          ${steps.map(s=>{
            const sdone=!!(s.completions&&s.completions[vd]);
            return `<div class="subhabit-row">
              <button class="sub-toggle${sdone?' on':''} ro">${sdone?'✓':''}</button>
              <span class="sub-name${sdone?' done':''}">${esc(s.name)}</span>
            </div>`;
          }).join('')}
        </div>`:''}`;
    } else {
      wrap.innerHTML=`
        <div class="habit-main-row">
          <span class="drag-handle" title="Drag to reorder">⠿</span>
          <div>${miniRing(wpct)}</div>
          <button class="h-toggle${done?' on':''}">${done?'✓':''}</button>
          <div class="h-info">
            <div class="h-name" id="hn-${h.id}">${esc(h.name)}</div>
            <div class="h-meta">
              <span class="streak">${iconFlame()} ${h.streak} day${h.streak!==1?'s':''}</span>
              <span>· ${wpct}% this week</span>
            </div>
          </div>
          ${stepsBadge}
          <div class="h-actions">
            <button class="subhabit-expand-btn" onclick="toggleSteps('${h.id}',this)" title="Add/view steps"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 3L8.5 6.5L5 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="btn icon-btn" onclick="editHabit('${h.id}')" title="Edit">${iconEdit()}</button>
            <button class="btn icon-btn del-btn" onclick="delHabit('${h.id}')" title="Delete">${iconTrash()}</button>
          </div>
        </div>
        <div class="subhabit-panel" id="${stepsExpId}">
          <div class="subhabit-progress"><div class="subhabit-progress-bar" style="width:${stepsPct}%"></div></div>
          ${steps.map(s=>{
            const sdone=!!(s.completions&&s.completions[vd]);
            return `<div class="subhabit-row">
              <button class="sub-toggle${sdone?' on':''}" onclick="toggleStep('${h.id}','${s.id}')">${sdone?'✓':''}</button>
              <span class="sub-name${sdone?' done':''}">${esc(s.name)}</span>
              <button class="sub-del" onclick="delStep('${h.id}','${s.id}')" title="Remove step">${iconTrash()}</button>
            </div>`;
          }).join('')}
          <div class="add-sub-row">
            <input class="add-sub-inp" id="stepIn-${h.id}" placeholder="Add a step…" maxlength="60"
              onkeydown="if(event.key==='Enter')addStep('${h.id}')"/>
            <button class="add-sub-btn" onclick="addStep('${h.id}')">+ Step</button>
          </div>
        </div>`;
      wrap.querySelector('.h-toggle').onclick=()=>toggleHabit(h.id);
      dnd(wrap,i);
    }
    list.appendChild(wrap);
  });
}

function renderTodos(){
  const list=$('todoList'); list.innerHTML='';
  const td=todayStr();
  const visible=S.todos.filter(t=>!t.scheduledFor||t.scheduledFor<=td);

  if(!visible.length){
    list.innerHTML=`<div class="empty">${iconCheck2()}<br>Nothing to do — enjoy your day!</div>`;
  } else {
    visible.forEach(t=>{
      const arrivesToday=t.scheduledFor===td;
      const el=document.createElement('div');
      el.className='todo-item pop'+(arrivesToday?' arrives-today':'');
      el.innerHTML=`
        <button class="t-toggle${t.done?' on':''}">${t.done?'✓':''}</button>
        <span class="t-text${t.done?' done':''}">${esc(t.text)}</span>
        ${arrivesToday?`<span class="t-badge">Scheduled</span>`:''}
        <button class="btn icon-btn del-btn" onclick="delTodo('${t.id}')" title="Delete">${iconTrash()}</button>`;
      el.querySelector('.t-toggle').onclick=()=>toggleTodo(t.id);
      list.appendChild(el);
    });
  }
  const pct=todoPct(),circ=119.4;
  $('todoRing').style.strokeDashoffset=(circ-(pct/100)*circ).toFixed(2);
  $('todoPct').textContent=pct+'%';
}

function renderOverview(){
  const vd=viewDateStr();
  const pct=isToday()?overallPct():pctForDate(vd);
  const circ=2*Math.PI*46;
  $('bigRing').style.strokeDashoffset=(circ-(pct/100)*circ).toFixed(2);
  $('bigPct').textContent=pct+'%';
  if(isToday()){
    $('greeting').textContent=greeting();
    const done=S.habits.filter(h=>h.completions[todayStr()]).length;
    $('ovSub').textContent=S.habits.length?`${done} of ${S.habits.length} habit${S.habits.length!==1?'s':''} completed today`:'No habits yet — add some below!';
    $('quote').textContent=QUOTES[new Date().getDay()%QUOTES.length];
  } else {
    $('greeting').textContent=fmtDate(vd);
    const done=S.habits.filter(h=>h.completions[vd]).length;
    $('ovSub').textContent=S.habits.length?`${done} of ${S.habits.length} habit${S.habits.length!==1?'s':''} completed that day`:'No habits tracked';
    $('quote').textContent='';
  }
  /* Update streak flame — show the best current streak across all habits */
  const bestStreak = S.habits.reduce((mx,h)=>Math.max(mx,h.streak||0), 0);
  const sc = $('streakCount');
  if(sc){
    sc.textContent = bestStreak;
    sc.style.animation = 'none';
    requestAnimationFrame(()=>{ sc.style.animation = 'streakCountUp .4s cubic-bezier(.4,0,.2,1) both'; });
  }
}

function renderWeekDots(){
  const el=$('weekDots'); el.innerHTML='';
  const td=todayStr(),vd=viewDateStr();
  last7().forEach(d=>{
    const pct=S.history[d]||(d===td?overallPct():0);
    const di=new Date(d+'T12:00:00').getDay();
    const isV=d===vd;
    const w=document.createElement('div');
    w.className='wd'+(isV?' is-viewing':'');
    w.title=`${fmtDate(d)}: ${pct}% — click to review`;
    w.innerHTML=`<div class="wd-dot${pct>=100?' on':''}${d===td?' now':''}${isV?' viewing':''}"></div><span>${DAYS[di]}</span>`;
    w.onclick=()=>{
      const today=new Date(td+'T12:00:00'),target=new Date(d+'T12:00:00');
      viewOffset=Math.round((target-today)/(864e5));
      syncDayNav();renderHabits();renderOverview();renderWeekDots();
    };
    el.appendChild(w);
  });
}

function renderAll(){
  renderHabits();renderTodos();renderOverview();renderWeekDots();renderAnalysis();syncDayNav();
}

/* ═══════════════════════════════════
   ACTIONS
═══════════════════════════════════ */
function addHabit(){
  const inp=$('habitIn'),name=inp.value.trim(); if(!name)return;
  S.habits.push({id:Date.now()+'',name,completions:{},streak:0,bestStreak:0,lastDate:null,steps:[]});
  inp.value='';save();renderAll();
}

function toggleHabit(id){
  if(!isToday())return;
  const h=S.habits.find(x=>x.id===id); if(!h)return;
  const t=todayStr(),was=!!h.completions[t];
  if(!was){
    h.completions[t]=true;
    const yest=new Date();yest.setDate(yest.getDate()-1);
    const ys=yest.toISOString().slice(0,10);
    if(h.lastDate===ys) h.streak=(h.streak||0)+1;
    else if(h.lastDate===t){}
    else h.streak=1;
    h.lastDate=t;h.bestStreak=Math.max(h.bestStreak||0,h.streak);
    const el=document.querySelector(`.habit-item[data-id="${id}"]`);
    if(el){el.classList.add('shimmer');setTimeout(()=>el.classList.remove('shimmer'),700);}
    chime();
  } else {
    h.completions[t]=false;
  }
  save();renderAll();
  const allDone=S.habits.length&&S.habits.every(h=>h.completions[todayStr()]);
  if(allDone&&!was) setTimeout(()=>{confetti();fanfare();toast('All habits complete! Incredible!');},300);
}

function editHabit(id){
  const span=$('hn-'+id); if(!span)return;
  const h=S.habits.find(x=>x.id===id); if(!h)return;
  const inp=document.createElement('input');
  inp.className='h-name-input';inp.value=h.name;inp.maxLength=42;
  span.replaceWith(inp);inp.focus();inp.select();
  const done=()=>{h.name=inp.value.trim()||h.name;save();renderAll();};
  inp.onblur=done;
  inp.onkeydown=e=>{if(e.key==='Enter')done();if(e.key==='Escape')renderAll();};
}

function delHabit(id){
  if(!confirm('Delete this habit permanently?'))return;
  S.habits=S.habits.filter(h=>h.id!==id);save();renderAll();
}

/* ── Sub-habit (step) actions ── */
function toggleSteps(hid, btn){
  const panel=$('steps-'+hid);
  if(!panel)return;
  const open=panel.classList.toggle('open');
  btn.classList.toggle('open',open);
}

function addStep(hid){
  const inp=$('stepIn-'+hid); if(!inp)return;
  const name=inp.value.trim(); if(!name)return;
  const h=S.habits.find(x=>x.id===hid); if(!h)return;
  if(!h.steps)h.steps=[];
  h.steps.push({id:Date.now()+'',name,completions:{}});
  inp.value='';
  save(); renderHabits();
  // Re-open the panel after re-render
  const panel=$('steps-'+hid);
  const btn=document.querySelector('.subhabit-expand-btn[onclick*="'+hid+'"]');
  if(panel){ panel.classList.add('open'); }
  if(btn){ btn.classList.add('open'); }
  // focus the new input
  const newInp=$('stepIn-'+hid);
  if(newInp) newInp.focus();
}

function toggleStep(hid, sid){
  if(!isToday())return;
  const h=S.habits.find(x=>x.id===hid); if(!h)return;
  const s=(h.steps||[]).find(x=>x.id===sid); if(!s)return;
  const td=todayStr();
  if(!s.completions)s.completions={};
  s.completions[td]=!s.completions[td];
  save();
  // Re-render just the steps panel without full renderAll
  const vd=viewDateStr();
  const steps=h.steps||[];
  const stepsDoneToday=steps.filter(st=>st.completions&&st.completions[vd]).length;
  const stepsPct=steps.length?Math.round(stepsDoneToday/steps.length*100):0;
  // Update progress bar
  const panel=$('steps-'+hid);
  if(panel){
    const bar=panel.querySelector('.subhabit-progress-bar');
    if(bar) bar.style.width=stepsPct+'%';
    // Update the toggled step row
    steps.forEach(st=>{
      const sdone=!!(st.completions&&st.completions[vd]);
      // Find the toggle for this step
    });
  }
  // Badge update
  const wrap=document.querySelector('[data-id="'+hid+'"]');
  if(wrap){
    const badge=wrap.querySelector('.sub-count-badge');
    if(badge) badge.textContent=stepsDoneToday+'/'+steps.length;
  }
  renderHabits();
  // Re-open panel
  const panelNew=$('steps-'+hid);
  if(panelNew) panelNew.classList.add('open');
  const btn=document.querySelector('.subhabit-expand-btn[onclick*="'+hid+'"]');
  if(btn) btn.classList.add('open');
}

function delStep(hid, sid){
  const h=S.habits.find(x=>x.id===hid); if(!h)return;
  h.steps=(h.steps||[]).filter(s=>s.id!==sid);
  save(); renderHabits();
  // Re-open panel if it had steps remaining
  if(h.steps.length){
    const panel=$('steps-'+hid);
    if(panel) panel.classList.add('open');
    const btn=document.querySelector('.subhabit-expand-btn[onclick*="'+hid+'"]');
    if(btn) btn.classList.add('open');
  }
}

function addTodo(){
  const inp=$('todoIn'),text=inp.value.trim(); if(!text)return;
  S.todos.push({id:Date.now()+'',text,done:false});
  inp.value='';save();renderTodos();
}

function toggleTodo(id){
  const t=S.todos.find(x=>x.id===id); if(!t)return;
  t.done=!t.done;if(t.done)tone(660,.22);
  save();renderTodos();
}

function delTodo(id){
  S.todos=S.todos.filter(t=>t.id!==id);save();renderTodos();
  if(schedOpen)renderSchedList();
}

/* ═══════════════════════════════════
   BACKUP SYSTEM
═══════════════════════════════════ */
let backupOpen   = false;
let bkAutoTimer  = null;
let bkIntervalMs = 15 * 60 * 1000; // default 15 min

/* In-session backup snapshots (up to 5 kept in localStorage) */
const BK_KEY = 'hf4_backups';

function bkLoad(){
  try{ return JSON.parse(localStorage.getItem(BK_KEY)||'[]'); }catch(e){ return []; }
}
function bkSave(list){ localStorage.setItem(BK_KEY, JSON.stringify(list.slice(-5))); }

/* Create a snapshot entry */
function snapshotNow(label){
  const list = bkLoad();
  const snap = {
    ts:     Date.now(),
    label:  label || 'Auto',
    habits: S.habits.length,
    todos:  S.todos.length,
    data:   JSON.stringify(S),
  };
  list.push(snap);
  bkSave(list);
  updateBkStatus();
  renderBkHistory();
}

/* Update the status bar */
function updateBkStatus(){
  const list = bkLoad();
  const dot  = $('bkDot');
  const title= $('bkStatusTitle');
  const sub  = $('bkStatusSub');
  if(!list.length){
    dot.className='bk-status-dot warn';
    title.textContent='No backups yet';
    sub.textContent='Export or wait for auto-backup';
    return;
  }
  const last = list[list.length-1];
  dot.className='bk-status-dot ok';
  title.textContent=`${last.habits} habit${last.habits!==1?'s':''}, ${last.todos} task${last.todos!==1?'s':''}`;
  const ago  = Math.round((Date.now()-last.ts)/60000);
  sub.textContent = ago < 1 ? 'Saved just now'
    : ago < 60 ? `Saved ${ago} min ago`
    : `Saved ${Math.round(ago/60)}h ago`;

  // Pulse dot in header
  const pulse = $('backupPulse');
  if(pulse){ pulse.className='backup-pulse saved'; setTimeout(()=>{ pulse.className='backup-pulse'; },2000); }
}

/* Render the recent-snapshots history list */
function renderBkHistory(){
  const el   = $('bkHistory'); if(!el) return;
  const list = bkLoad();
  if(!list.length){ el.innerHTML=''; return; }
  const reversed = [...list].reverse();
  el.innerHTML = `<div class="bk-history-lbl">Recent snapshots (${list.length}/5)</div>` +
    reversed.map((s,i)=>{
      const realIdx = list.length-1-i; // index into original list
      const d = new Date(s.ts);
      const timeStr = d.toLocaleDateString(undefined,{month:'short',day:'numeric'})
        +' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
      return `<div class="bk-hist-item">
        <span class="bk-hist-time">${timeStr}</span>
        <span class="bk-hist-info">${s.label} · ${s.habits} habits, ${s.todos} tasks</span>
        <button class="bk-hist-restore" onclick="restoreSnapshot(${realIdx})" title="Restore this snapshot">Restore</button>
      </div>`;
    }).join('');
}

/* Restore from a snapshot */
function restoreSnapshot(idx){
  const list = bkLoad();
  const snap = list[idx]; if(!snap) return;
  if(!confirm(`Restore snapshot from ${new Date(snap.ts).toLocaleString()}?\nThis will overwrite your current data.`)) return;
  try{
    S = JSON.parse(snap.data);
    S.habits    = (S.habits||[]).map(h=>({streak:0,bestStreak:0,completions:{},lastDate:null,steps:[],...h}));
    S.todos     = S.todos   || [];
    S.history   = S.history || {};
    S.scheduled = S.scheduled || [];
    save();
    renderAll();
    toast('Snapshot restored!');
    tone(440,.2); setTimeout(()=>tone(660,.2),120);
    closeBackup();
  }catch(e){ alert('Could not restore snapshot.'); }
}

/* ── Export: download a .json file ── */
function exportBackup(){
  const payload = {
    version:   2,
    exportedAt: new Date().toISOString(),
    appName:   'HabitFlow',
    data:      S,
  };
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `habitflow-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  snapshotNow('Manual export');
  toast('Backup downloaded!');
}

/* ── Import: read a .json file ── */
function importBackup(){
  $('bkFileIn').value='';
  $('bkFileIn').click();
}
function onImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const parsed = JSON.parse(ev.target.result);
      const raw = parsed.data || parsed; // support both wrapped and raw formats
      if(!raw.habits) throw new Error('Invalid backup file');
      if(!confirm(`Import backup from ${file.name}?\nThis will overwrite your current data.`)) return;
      S = raw;
      S.habits    = (S.habits||[]).map(h=>({streak:0,bestStreak:0,completions:{},lastDate:null,steps:[],...h}));
      S.todos     = S.todos   || [];
      S.history   = S.history || {};
      S.scheduled = S.scheduled || [];
      save();
      snapshotNow('Imported');
      renderAll();
      toast('Backup imported successfully!');
      tone(523,.2); setTimeout(()=>tone(784,.2),130);
      closeBackup();
    }catch(err){
      alert('Could not read backup file. Make sure it\'s a valid HabitFlow .json export.');
    }
  };
  reader.readAsText(file);
}

/* ── Auto-backup timer ── */
function startAutoBackup(){
  if(bkAutoTimer) clearInterval(bkAutoTimer);
  if(bkIntervalMs <= 0) return;
  bkAutoTimer = setInterval(()=>{
    if(S.habits.length || S.todos.length){
      snapshotNow('Auto');
    }
  }, bkIntervalMs);
}

function setBkInterval(){
  const sel = $('bkInterval');
  const mins = parseInt(sel.value);
  bkIntervalMs = mins * 60 * 1000;
  localStorage.setItem('hf_bkInterval', mins);
  startAutoBackup();
  toast(mins===0 ? 'Auto-backup turned off' : `Auto-backup set to every ${mins} min`);
}

/* ── Toggle / close backup panel ── */
function toggleBackup(e){
  if(e) e.stopPropagation();
  if(backupOpen){ closeBackup(); return; }
  if(schedOpen) closeScheduler();
  backupOpen=true;
  const btn=$('backupBtn');
  const rect=btn.getBoundingClientRect();
  const dd=$('backupDropdown');
  const isMobile=window.innerWidth<=600;
  if(isMobile){
    dd.style.top=(rect.bottom+6)+'px';
    dd.style.left='.75rem';
    dd.style.right='.75rem';
    dd.style.width='';
  } else {
    dd.style.top=(rect.bottom+8)+'px';
    dd.style.right=(window.innerWidth-rect.right)+'px';
    dd.style.left='';
    dd.style.width='310px';
  }
  $('backupDropdown').classList.add('open');
  updateBkStatus();
  renderBkHistory();
}
function closeBackup(){
  backupOpen=false;
  $('backupDropdown').classList.remove('open');
}

/* ── Restore saved interval preference ── */
function initBackup(){
  const saved = parseInt(localStorage.getItem('hf_bkInterval')||'15');
  bkIntervalMs = saved * 60 * 1000;
  const sel = $('bkInterval');
  if(sel) sel.value = saved;
  startAutoBackup();
  updateBkStatus();
}

load();
checkDay();

if(S.habits.length || S.todos.length) snapshotNow('Session start');
setInterval(()=>{checkDay();setDatePill();renderOverview();renderWeekDots();renderAnalysis();},60000);
